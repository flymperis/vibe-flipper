# ---------- iPad ----------
# Normalized: "iPad Pro 12.9 M2" -> "ipad pro 12 9 m 2", "iPad Air (5th gen)" -> "ipad air 5 th gen".
# Pro models are split by screen size (no size stated -> treated as the 11").
# Base iPads by generation: "iPad 8" / "8th gen" / "8ης γενιάς" (-> "8 ησ") or the year anywhere in the title.
# Not "iPad 9.7"/"10.2" (screen sizes shared by several generations) nor "iPad 4G"/"5G" (cellular).
- name: iPad 4 (2012)
  category: iPad
  specs: [storage]
  include: [ipad]
  regex: '\bipad 4\b(?! (g|7|2)\b)|\b4 (th|ησ|η)\b|\b2012\b'
  exclude: [pro, air, mini, iphone, ipad 4 g]
  min_price: 20
  max_price: 100
  queries: [ipad 4]

- name: iPad 5 (2017)
