# Initial product catalog (loaded only when the DB has no products; `python -m scripts.sync_seed` applies changes).
# GPUs and CPUs live in seed_hardware.yaml (generated by scripts/gen_hardware_seed.py).
# Matching works on the *normalized* title: lowercase, no accents, punctuation -> spaces,
# letters/digits split ("ps5" -> "ps 5", "rtx3070ti" -> "rtx 3070 ti", "m1" -> "m 1", "5800x3d" -> "5800 x 3 d").
#   include: any phrase (whole words) must appear. A trailing * = word prefix ("υπολογιστ*").
#   exclude: none of these may appear.
#   regex:   optional extra condition on the normalized title.
#   min/max_price: outside this range the listing is treated as an accessory/other item.
#   queries: search terms for all three sites.
#   require: match only listings whose extracted spec equals this, e.g. {storage: 1024} ("SSD 1TB").
#   specs:   which specs split the product into price variants: [ram], [storage] or [ram, storage]
#            (for GPUs "ram" = VRAM). Listings are compared with the median of their own variant.

